<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direto do Forno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="divMae">
        <div class = "cabeçalho">
            <h1 class = "titulo">
                Direto do Forno
            </h1>
            <h2 class = "subParte1">
                Sua despensa,
            </h2>
            <h2 class = "subParte2">
                novas possibilidades
            </h2>
        </div>
        <div class = "divExpositorio">
            <h1 class = "expositorio">
                Ingredientes disponíveis
            </h1>
            <!-- O que faz a mágica acontecer -->
            <form action="http://localhost:8080/buscar" method="get">
                <!--Criação de formulários-->
                <div class = "container">
                    <label>
                        <input type="checbox" neme="ingredientes" value="arroz"><span>
                            Arroz
                        </span>
                    </label>
                    <label>
                        <input type="checbox" neme="ingredientes" value="tomate"><span>
                            Tomate
                        </span>
                    </label>
                    <label>
                        <input type="checbox" neme="ingredientes" value="sal"><span>
                            Sal
                        </span>
                    </label>
                    <label>
                        <input type="checbox" neme="ingredientes" value="ovos"><span>
                            Ovos
                        </span>
                    </label>
                    <label>
                        <input type="checbox" neme="ingredientes" value="Atum"><span>
                            Atum
                        </span>
                    </label>
                </div>
                <button type="submit" class="btnEnviar">
                    Buscar Receitas
                </button>
            </form>

            <div class = "divSecundaria">
                <h5 class="pequenoTitulo">
                    FEITAS PARA VOCÊ
                </h5>
                <h1 class = "receitaMae">
                    Receitas que Combinam
                </h1>
                <h5 class="pequenoTituloP2">
                    Sugestões baseadas em seus ingredientes
                </h5>
                <div class = "exibirReceitas">

                </div>
            
            </div>
        </div>
    </div>  
   
</body>
</html>
